name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-app/*.gradle*', 'android-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build Android app
        run: cd android-app && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: PicxCraft-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          tag_name: v1.0.0
          release_name: PicxCraft Android App v1.0.0
          body: |
            ## PicxCraft Android App v1.0.0
            
            Download the latest Android APK for PicxCraft - Free Online Image Tools.
            
            ### Features:
            - 114+ free image tools
            - Full WebView experience
            - Native Android integration
            - File upload support (camera & gallery)
            
            ### Installation:
            1. Download the APK below
            2. Enable "Install from unknown sources" in Android settings
            3. Install and enjoy!
            
            ### Note:
            The Android app contains ads to support free development. The website version (picxcraft.great-site.net) is ad-free.
            
            ### Links:
            - Website: https://picxcraft.great-site.net
            - GitHub: https://github.com/Professional-X/PicxCraft
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
